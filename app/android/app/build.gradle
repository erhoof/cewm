apply plugin: 'com.android.application'

android {
    namespace "ru.erhoof.cewm"
    compileSdkVersion 34
    defaultConfig {
        applicationId "ru.erhoof.cewm"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 2
        versionName "1.4.0"
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main {
        // SDL's Java side (SDLActivity & co) comes from the same checkout the native build uses.
        java.srcDir "$rootDir/../../../android-ports/SDL/android-project/app/src/main/java"
        jniLibs.srcDir 'libs'  // libmain.so + libSDL2.so, filled by ../build.sh
    }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    lint { abortOnError false }
}
